name: Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest

    env:
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      SIMLI_API_KEY: ${{ secrets.SIMLI_API_KEY }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create minimal .env for compose
        run: |
          cat > .env <<EOF
          DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          CARTESIA_API_KEY=${CARTESIA_API_KEY}
          SIMLI_API_KEY=${SIMLI_API_KEY}
          LIVEKIT_URL=${LIVEKIT_URL}
          LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
          LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
          EOF

      - name: Build services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for agent health check
        run: |
          echo "Waiting for agent to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker compose ps agent --format json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ]; then
              echo "Agent is healthy after ${i} attempts."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Agent did not become healthy in time."
              docker compose logs agent
              exit 1
            fi
            sleep 5
          done

      - name: Wait for frontend health check
        run: |
          echo "Waiting for frontend to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker compose ps frontend --format json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ]; then
              echo "Frontend is healthy after ${i} attempts."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Frontend did not become healthy in time."
              docker compose logs frontend
              exit 1
            fi
            sleep 5
          done

      - name: Run integration tests
        run: |
          cd agent
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock
          pytest tests/integration/ -v --timeout=60

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
