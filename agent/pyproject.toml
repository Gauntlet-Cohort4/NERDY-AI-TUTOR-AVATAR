[project]
name = "nerdy-ai-tutor-agent"
version = "0.1.0"
description = "Real-time AI video avatar tutor — LiveKit agent backend"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[deepgram,groq,cartesia,simli,silero,turn-detector]~=1.4",
    "structlog>=24.0.0,<25.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.0,<4.0",
    "ruff>=0.4,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (requires API keys)",
]
