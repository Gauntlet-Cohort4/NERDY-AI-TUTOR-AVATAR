version: "3.8"

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - agent
    restart: unless-stopped
